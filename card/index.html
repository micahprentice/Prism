<style>
  :root{
    --bg:#0B0C18;
    --ink:#F4F6FB;
    --mid:#C5CAD6;
    --dim:#8B93A7;
    --pink:#E44B87;
    --line:rgba(255,255,255,.1);
    --sans:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  }
  .sheet{width:100%;max-width:440px;margin:0 auto}
  .hero{
    position:relative;
    overflow:hidden;
    border-radius:28px;
    background:#0B0C18;
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 30px 80px rgba(0,0,0,.35);
    padding:0 0 28px;
  }
  .stage{position:relative;height:248px}
  .fx{position:absolute;inset:0;width:100%;height:100%;display:block}
  .mark{
    position:absolute;left:22px;top:34px;height:118px;width:auto;
    filter:drop-shadow(0 10px 24px rgba(73,152,239,.18));
  }
  .wm{
    position:absolute;left:24px;top:164px;margin:0;
    font-weight:800;font-stretch:125%;font-size:13px;letter-spacing:.42em;
    color:var(--ink);
  }
  h1{
    position:relative;z-index:1;
    margin:10px 14px 0;
    max-width:none;
    font-size:clamp(17.5px,6.15vw,28px);
    font-weight:800;font-stretch:96%;
    line-height:1.05;letter-spacing:-.034em;
  }
  h1 .run,
  h1 .build{
    display:block;
    white-space:nowrap;
  }
  h1 .build{
    margin-top:3px;font-style:normal;
    background:linear-gradient(90deg,#E44B87 0%,#EB7DB6 32%,#7E9FE0 68%,#4998EF 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-fill-color:transparent;
  }
  .who{padding:26px 6px 0}
  h2{
    margin:0;
    font-size:28px;font-weight:700;font-stretch:112%;
    letter-spacing:-.02em;line-height:1.05;
  }
  .role{
    margin:10px 0 0;
    color:var(--pink);
    font-size:12px;font-weight:600;letter-spacing:.22em;
  }
  .lines{margin:16px 0 0;display:grid;gap:6px}
  .lines a{
    color:var(--ink);text-decoration:none;
    font-size:16.5px;font-weight:500;letter-spacing:-.01em;
  }
  .lines a:hover{color:#fff}
  .save{
    display:flex;align-items:center;justify-content:center;gap:12px;
    width:100%;margin-top:22px;padding:18px 20px;
    border-radius:18px;border:0;
    background:linear-gradient(100deg,#F6C3DA 0%,#FFFFFF 42%,#D5E8FC 100%);
    color:#0B0C18;
    font-family:inherit;font-size:18px;font-weight:800;letter-spacing:-.02em;
    text-decoration:none;
    box-shadow:0 14px 40px rgba(228,75,135,.22);
  }
  .save svg{width:22px;height:22px}
  .save:hover{filter:brightness(1.03)}
  .save:active{transform:translateY(1px)}
  .secondary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
  .secondary a{
    display:flex;align-items:center;justify-content:center;gap:8px;
    min-height:48px;min-width:0;padding:10px 6px;border-radius:14px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);
    color:var(--ink);text-decoration:none;
    font-size:14px;font-weight:600;
  }
  .secondary a:hover{border-color:rgba(255,255,255,.22)}
  .secondary svg{width:16px;height:16px;flex:0 0 auto}
  .save:focus-visible,.secondary a:focus-visible,.lines a:focus-visible{
    outline:2px solid #4998EF;outline-offset:3px;
  }
  @media (min-width:800px){
    body{padding:48px 32px 64px}
    .sheet{max-width:920px}
    .hero{border-radius:32px;padding-bottom:40px}
    .stage{height:320px}
    .mark{left:48px;top:48px;height:156px}
    .wm{left:52px;top:218px;font-size:16px}
    h1{margin:8px 40px 0;font-size:clamp(34px,4.5vw,50px);font-stretch:106%;max-width:none}
    .after{
      display:grid;grid-template-columns:1.15fr .85fr;
      gap:36px;align-items:end;padding:8px 46px 0;
    }
    .who{padding:28px 0 0}
    h2{font-size:36px}
    .save{margin-top:0}
  }
  @media (prefers-reduced-motion:no-preference){
    .beam{animation:shimmer 3.8s ease-in-out infinite}
    .fan{animation:shimmer 5.4s ease-in-out infinite}
    .rays{animation:rayglow 4.6s ease-in-out infinite}
  }
  @keyframes shimmer{0%,100%{opacity:.7}50%{opacity:1}}
  @keyframes rayglow{0%,100%{opacity:.5}50%{opacity:.95}}
  @media (prefers-reduced-motion:reduce){
    .beam,.fan,.rays{animation:none}
    .save{transition:none}
  }
</style>

        </g>

      <img class="mark" src="prism-mark.png" alt="Prism">
      <p class="wm">PRISM</p>

    <h1><span class="run">Run the business you have.</span><span class="build">Build the business you want.</span></h1>

    <section class="who">
